name: ws_bot_ck2

on:
  workflow_dispatch:
    inputs:
      claim_min:
        description: 'Claim min (xu)'
        required: false
        default: '40000'
      bot_runtime:
        description: 'Runtime seconds'
        required: false
        default: '21600'

permissions:
  contents: read

concurrency:
  group: ws-bot-ck2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets playwright
      - run: playwright install chromium --with-deps
      - name: Capture token from cookie (ck2.txt)
        run: |
          python3 capture_token.py --cookie ck2.txt --output state/tokens/ck2_token.json
      - name: Run bot (websocket + token)
        env:
          CLAIM_MIN: ${{ inputs.claim_min || '40000' }}
          CLAIM_MAX: '50000'
          BET_ID: '10'
          MAX_CLAIMS: '100'
          RUNTIME_SECONDS: ${{ inputs.bot_runtime || '21600' }}
        run: |
          echo "=== ws_bot ck2 (cookie -> token -> websocket) ==="
          python3 ws_bot_ck2.py --token-file state/tokens/ck2_token.json
