name: ws_bot

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Target player name (e.g. nguyen123456)'
        required: false
        default: 'nguyen123456'
      target_id:
        description: 'Target player ID (e.g. 68982512)'
        required: false
        default: '68982512'
      claim_min:
        description: 'Min balance to stop claiming (xu)'
        required: false
        default: '40000'
      bet_id:
        description: 'Bet amount ID (5=1000, 7=4000, 10=40000)'
        required: false
        default: '10'
  schedule:
    - cron: '0,30 * * * *'  # mỗi 30 phút

permissions:
  contents: read
  actions: write

concurrency:
  group: ws-bot
  cancel-in-progress: false  # KHÔNG cancel — để bot chạy xong

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # 35 min (runtime 30 min + buffer)
    strategy:
      fail-fast: false
      max-parallel: 1  # CHỈ 1 BOT CÙNG LÚC — tránh conflict bàn target
      matrix:
        cookie: [ck1, ck2, ck3, ck5, ck6, ck10, ck11, ck12, ck13]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install websockets

      - name: Check token file exists
        id: check
        run: |
          if [ ! -f state/tokens/${{ matrix.cookie }}_token.json ]; then
            echo "Token file not found — skipping"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Run WS bot
        if: steps.check.outputs.exists == 'true'
        env:
          TARGET_NAME: ${{ inputs.target_name || 'nguyen123456' }}
          TARGET_ID: ${{ inputs.target_id || '68982512' }}
          CLAIM_MIN: ${{ inputs.claim_min || '40000' }}
          BET_ID: ${{ inputs.bet_id || '10' }}
          MAX_CLAIMS: '100'
          RUNTIME_SECONDS: '1800'
        run: |
          echo "=== Running WS bot for ${{ matrix.cookie }} ==="
          echo "Target: $TARGET_NAME (id=$TARGET_ID)"
          echo "Claim min: $CLAIM_MIN"
          echo "Bet ID: $BET_ID"
          python3 ws_bot.py --token-file state/tokens/${{ matrix.cookie }}_token.json
