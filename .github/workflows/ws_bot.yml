name: ws_bot

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Target player name (e.g. nguyen123456)'
        required: false
        default: 'nguyen123456'
      target_id:
        description: 'Target player ID'
        required: false
        default: '68982512'
      claim_min:
        description: 'Min balance to stop claiming (xu)'
        required: false
        default: '40000'
      claim_max:
        description: 'Max balance — game blocks claim above this (xu)'
        required: false
        default: '50000'
      bet_id:
        description: 'Bet amount ID (10=40000)'
        required: false
        default: '10'
      bot_runtime:
        description: 'Runtime per bot in seconds (default 3300 = 55 min)'
        required: false
        default: '3300'
  schedule:
    - cron: '0 * * * *'  # mỗi 1 giờ

permissions:
  contents: read
  actions: write

concurrency:
  group: ws-bot-${{ github.workflow }}
  cancel-in-progress: false  # KHÔNG cancel — để bot chạy xong

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 11  # TẤT CẢ CHẠY ĐỒNG THỜI
      matrix:
        cookie: [ck1, ck2, ck3, ck5, ck6, ck8, ck9, ck10, ck11, ck12, ck13]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install websockets

      - name: Check token file exists
        id: check
        run: |
          if [ ! -f state/tokens/${{ matrix.cookie }}_token.json ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Run WS bot (parallel, unlimited cycles)
        if: steps.check.outputs.exists == 'true'
        env:
          TARGET_NAME: ${{ inputs.target_name || 'nguyen123456' }}
          TARGET_ID: ${{ inputs.target_id || '68982512' }}
          CLAIM_MIN: ${{ inputs.claim_min || '40000' }}
          CLAIM_MAX: ${{ inputs.claim_max || '50000' }}
          BET_ID: ${{ inputs.bet_id || '10' }}
          MAX_CLAIMS: '100'
          RUNTIME_SECONDS: ${{ inputs.bot_runtime || '3300' }}
        run: |
          echo "=== [$(date '+%H:%M:%S')] Running ${{ matrix.cookie }} (parallel) ==="
          echo "Target: $TARGET_NAME (id=$TARGET_ID)"
          echo "Runtime: $RUNTIME_SECONDS s ($(( RUNTIME_SECONDS / 60 )) min)"
          python3 ws_bot.py --token-file state/tokens/${{ matrix.cookie }}_token.json

      - name: Skip (no token)
        if: steps.check.outputs.exists != 'true'
        run: echo "No token file for ${{ matrix.cookie }} — skipping"
