name: ws_bot

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Target player name (e.g. nguyen123456)'
        required: false
        default: 'nguyen123456'
      target_id:
        description: 'Target player ID (e.g. 68982512)'
        required: false
        default: '68982512'
      claim_min:
        description: 'Min balance to stop claiming (xu)'
        required: false
        default: '40000'
      claim_max:
        description: 'Max balance — game blocks claim above this (xu)'
        required: false
        default: '55000'
      bet_id:
        description: 'Bet amount ID (5=1000, 7=4000, 10=40000)'
        required: false
        default: '10'
      bot_runtime:
        description: 'Runtime per bot in seconds (default 300 = 5 min)'
        required: false
        default: '300'
  schedule:
    - cron: '0 * * * *'  # mỗi 1 giờ

permissions:
  contents: read
  actions: write

concurrency:
  group: ws-bot
  cancel-in-progress: false

jobs:
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 80  # 11 bots × (5+1) min = 66 min + buffer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install websockets

      - name: Run bots sequentially (1 min apart)
        env:
          TARGET_NAME: ${{ inputs.target_name || 'nguyen123456' }}
          TARGET_ID: ${{ inputs.target_id || '68982512' }}
          CLAIM_MIN: ${{ inputs.claim_min || '40000' }}
          CLAIM_MAX: ${{ inputs.claim_max || '55000' }}
          BET_ID: ${{ inputs.bet_id || '10' }}
          MAX_CLAIMS: '100'
          RUNTIME_SECONDS: ${{ inputs.bot_runtime || '300' }}
        run: |
          echo "=== WS Bot — sequential (1 min apart) ==="
          echo "Target: $TARGET_NAME (id=$TARGET_ID)"
          echo "Claim range: [$CLAIM_MIN, $CLAIM_MAX]"
          echo "Bot runtime: $RUNTIME_SECONDS s"
          echo ""

          for cookie in ck1 ck2 ck3 ck5 ck6 ck8 ck9 ck10 ck11 ck12 ck13; do
            if [ -f state/tokens/${cookie}_token.json ]; then
              echo "=== [$(date '+%H:%M:%S')] Running $cookie ==="
              python3 ws_bot.py --token-file state/tokens/${cookie}_token.json || true
              echo "=== [$(date '+%H:%M:%S')] $cookie done ==="
              echo "--- Waiting 60s before next bot ---"
              sleep 60
            else
              echo "=== Skip $cookie (no token file) ==="
            fi
          done

          echo ""
          echo "=== All bots done ==="
