name: create_fb_account

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email (Hotmail) dùng để đăng ký'
        required: true
        default: ''
      password:
        description: 'Password cho tài khoản mới'
        required: true
        default: ''
      first_name:
        description: 'First name'
        required: true
        default: ''
      last_name:
        description: 'Last name'
        required: true
        default: ''
      headless:
        description: 'Headless'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run create_fb_account.py
        run: |
          python3 create_fb_account.py \
            --email "${{ inputs.email }}" \
            --password "${{ inputs.password }}" \
            --first-name "${{ inputs.first_name }}" \
            --last-name "${{ inputs.last_name }}" \
            --headless "${{ inputs.headless }}"
