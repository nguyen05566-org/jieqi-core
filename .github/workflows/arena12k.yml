name: arena12k

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '6'
        type: string
      use_playwright:
        description: 'Use Playwright stealth transport'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests playwright playwright-stealth --break-system-packages

      - name: Install Playwright browsers
        if: ${{ inputs.use_playwright == 'true' }}
        run: playwright install chromium --with-deps

      - name: Run Caro Bot
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          CARO_USER: vanman374
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_BET_XU: '400'
          CARO_AUTO_IDENTITY: '0'
          CARO_USE_PW: ${{ inputs.use_playwright }}
        run: |
          echo "Starting bot (use_playwright=$CARO_USE_PW)"
          if [ "$CARO_USE_PW" = "true" ]; then
            SCRIPT=arena12k_pw.py
          else
            SCRIPT=arena12k.py
          fi
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting $SCRIPT ==="
            python3 "$SCRIPT" || echo "$SCRIPT exited with code $?"
            echo "Restarting $SCRIPT in 10 seconds"
            sleep 10
          done