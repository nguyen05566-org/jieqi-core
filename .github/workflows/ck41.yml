name: ck41

# === CHẾ ĐỘ CHẠY ===
# - workflow_dispatch: trigger thủ công từ tab Actions
# - schedule (cron mỗi 6h): tự động chạy lúc 00:00, 06:00, 12:00, 18:00 UTC
# Cookie được đọc từ file `ck41.txt` trong repo (không cần secret FB_COOKIE).
# Target name + ID are hardcoded in code (repo is private).
# Concurrency + cancel-in-progress: true → nếu run mới trigger khi run cũ chưa xong,
# run cũ sẽ bị cancel để tránh chồng (chống account bị flag bot).
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Số cycle (claim → surrender) mỗi run'
        required: false
        default: '20'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
          - '20'
          - '30'
          - '40'
      claim_min:
        description: 'Ngưỡng dừng claim (xu)'
        required: false
        default: '50000'
        type: string
      claim_max:
        description: 'Hard stop claim (xu)'
        required: false
        default: '55000'
        type: string
      target_wait_seconds:
        description: 'Số giây chờ target tạo bàn trước khi bỏ cuộc (mỗi cycle)'
        required: false
        default: '60'
        type: string
      mode:
        description: 'Chế độ chơi'
        required: false
        default: 'surrender_to_target'
        type: choice
        options:
          - 'surrender_to_target'
          - 'create_own_table'
      bet_amount:
        description: 'Số xu đặt cược khi tạo bàn (create_own_table mode)'
        required: false
        default: '40000'
        type: string
      wait_for_opponent:
        description: 'Chờ người khác vào bàn (create_own_table mode)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      opponent_wait_seconds:
        description: 'Số giây chờ người vào bàn (create_own_table mode)'
        required: false
        default: '120'
        type: string
  schedule:
    # Chạy mỗi 6h (UTC): 00:00, 06:00, 12:00, 18:00
    # = 07:00, 13:00, 19:00, 01:00 giờ Việt Nam (UTC+7)
    - cron: '0 0,6,12,18 * * *'

permissions:
  actions: write   # cho phép gh CLI trigger lại workflow (auto-restart)
  contents: read

concurrency:
  group: ck41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max 6h trên GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Verify cookie file is present
        run: |
          if [ ! -f ck41.txt ]; then
            echo "::error::Cookie file ck41.txt not found in repo. Commit it (the repo is private)."
            exit 1
          fi
          COOKIE_SIZE=$(wc -c < ck41.txt)
          COOKIE_ENTRIES=$(awk -F';' '{print NF}' ck41.txt)
          echo "Cookie file: $COOKIE_SIZE bytes, $COOKIE_ENTRIES entries"
          if [ "$COOKIE_SIZE" -lt 100 ]; then
            echo "::error::Cookie file too small — likely empty or corrupt"
            exit 1
          fi
          # Print redacted preview
          head -c 30 ck41.txt
          echo "...(redacted)"

      - name: Run auto_cycle_ck41.py
        env:
          SINGLE_COOKIE_FILE: 'ck41.txt'
          CYCLES: ${{ inputs.cycles || '20' }}
          CLAIM_MIN: ${{ inputs.claim_min || '50000' }}
          CLAIM_MAX: ${{ inputs.claim_max || '55000' }}
          BET_MAX: '100000'
          HEADLESS: 'true'
          MAX_CLAIMS_PER_CYCLE: '200'
          CLAIM_COOLDOWN: '1.0'
          DELAY_BETWEEN_CYCLES: '10'
          TARGET_WAIT_SECONDS: ${{ inputs.target_wait_seconds || '60' }}
          MAX_TABLES_TO_SCAN: '40'
          PYTHONUNBUFFERED: '1'
          MODE: ${{ inputs.mode || 'surrender_to_target' }}
          BET_AMOUNT: ${{ inputs.bet_amount || '40000' }}
          WAIT_FOR_OPPONENT: ${{ inputs.wait_for_opponent || 'true' }}
          OPPONENT_WAIT_SECONDS: ${{ inputs.opponent_wait_seconds || '120' }}
        run: |
          set +e
          echo "=== Configuration ==="
          echo "Cookie file: $SINGLE_COOKIE_FILE (read from repo, not secret)"
          echo "Target: hardcoded in code (nguyen123456, id=68952059)"
          echo "Cycles: $CYCLES"
          echo "Claim range: [$CLAIM_MIN, $CLAIM_MAX]"
          echo "Bet max: $BET_MAX"
          echo "Target wait: ${TARGET_WAIT_SECONDS}s per cycle"
          echo "Max tables to scan per attempt: $MAX_TABLES_TO_SCAN"
          echo "Mode: $MODE"
          echo "Bet amount (create_own_table): $BET_AMOUNT"
          echo "Wait for opponent: $WAIT_FOR_OPPONENT"
          echo "Opponent wait seconds: $OPPONENT_WAIT_SECONDS"
          echo ""
          echo "=== Starting auto_cycle_ck41.py at $(date '+%H:%M:%S') ==="
          python3 auto_cycle_ck41.py
          EXIT=$?
          echo "=== Bot exited code=$EXIT at $(date '+%H:%M:%S') ==="
          exit 0  # always success so log step below runs

      - name: Show full log
        if: always()
        run: |
          echo "=== Job completed at $(date '+%H:%M:%S') ==="

      - name: Upload debug artifacts (state + fingerprints)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck41_state_${{ github.run_id }}
          path: |
            state/
            fingerprints/
            transfer_dests.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Auto-restart (continuous loop)
        # Auto-trigger lại workflow sau khi hoàn thành để chạy liên tục
        # Mỗi run chạy ~5h (20 cycles × ~15m), cron chạy mỗi 6h
        if: false  # disabled — auto-restart via cron schedule instead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          echo "Triggering next ck41 run..."
          gh workflow run ck41.yml --ref "$GITHUB_REF" \
            -f cycles="${{ inputs.cycles || '20' }}" \
            -f claim_min="${{ inputs.claim_min || '50000' }}" \
            -f claim_max="${{ inputs.claim_max || '55000' }}" \
            -f mode="${{ inputs.mode || 'surrender_to_target' }}" \
            -f bet_amount="${{ inputs.bet_amount || '40000' }}" \
            || echo "(restart failed — will retry on next cron)"
