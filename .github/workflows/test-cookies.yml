name: test-cookies

# Lightweight cookie liveness check (plain HTTPS GET to facebook.com,
# no game/bot launch). Runs on GitHub-hosted runner because the local
# sandbox has no egress to facebook.com.
# - workflow_dispatch: manual run (any branch)
# - push: only on the arena test branch, only when tester/cookies change
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/7e9fb419-jieqi-core"
    paths:
      - "tools/test_cookies.py"
      - ".github/workflows/test-cookies.yml"
      - "ck*.txt"

permissions:
  contents: write # to commit the masked result report back to this branch

jobs:
  test-cookies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright Chromium (real browser, like the bots)
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Test all cookies (masked output only)
        run: python3 tools/test_cookies.py

      - name: Commit results back to this branch (masked, no cookie values)
        if: always()
        run: |
          ls -la cookie_test_results.json cookie_test_results.md
          mkdir -p cookie-test-results
          cp cookie_test_results.json cookie-test-results/latest.json
          cp cookie_test_results.md cookie-test-results/latest.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cookie-test-results/latest.json cookie-test-results/latest.md
          git commit -m "Cookie test results [skip ci]" || { echo "no result changes"; exit 0; }
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload results (no cookie values, masked ids only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-test-results_${{ github.run_id }}
          path: |
            cookie_test_results.json
            cookie_test_results.md
          if-no-files-found: ignore
          retention-days: 7
