name: build_alphagomoku

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build_alphagomoku
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Clone MinML
        run: git clone https://github.com/MaciejKozarzewski/minml minml && cd minml && git checkout -q 0fb639f49e && cd ..

      - name: Clone AlphaGomoku source (vanilla v5.9.3, 15x15 + rule 8 CARO6)
        run: git clone --depth 1 --branch v5.9.3 https://github.com/MaciejKozarzewski/AlphaGomoku ag-src

      - name: Build MinML (CPU)
        run: |
          cd minml
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build -j
          mkdir -p build/cpu/Release/lib
          cp build/lib/libMinML_cpu.a build/cpu/Release/lib/

      - name: Build AlphaGomoku
        run: |
          cd ag-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DMINML_BACKEND_PATH=$GITHUB_WORKSPACE/minml
          cmake --build build -j --target ag_player_cpu
          cp build/bin/ag_player_cpu ../pbrain-AlphaGomoku

      - name: Download config and networks
        run: |
          curl -sL https://github.com/MaciejKozarzewski/AlphaGomoku/releases/download/v5.9.3/AlphaGomoku_linux.zip -o rel.zip
          unzip -o -q rel.zip config.json networks/*

      - name: Package artifact (CARO6 15x15)
        run: |
          mkdir -p package/networks
          cp pbrain-AlphaGomoku config.json package/
          cp networks/caro6_conv_8x128.bin networks/caro5_conv_8x128.bin package/networks/
          chmod +x package/pbrain-AlphaGomoku
          tar czf alphagomoku_caro6_15x15.tar.gz -C package .

      - name: Smoke test protocol (start 15, info rule 8)
        run: |
          cd package
          chmod 755 pbrain-AlphaGomoku
          printf 'about\nstart 15\ninfo rule 8\nrestart\nend\n' | timeout 60 ./pbrain-AlphaGomoku > out.txt 2> err.txt || true
          cat out.txt err.txt
          grep -q "OK" out.txt || (echo "Smoke test failed: no OK from start 15" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: alphagomoku-caro6-15x15
          path: alphagomoku_caro6_15x15.tar.gz
          retention-days: 7

      - name: Publish to GitHub Release (persistent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="alphagomoku-15x15"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "AlphaGomoku CARO6 15x15 (vanilla v5.9.3)" --notes "pbrain-AlphaGomoku + config.json + networks (caro5/caro6). Build vanilla v5.9.3: START 15 + info rule 8 (CARO6), 15x15 only."
          gh release upload "$TAG" alphagomoku_caro6_15x15.tar.gz --clobber
