name: ck1-10

on:
  workflow_dispatch:

env:
  TRANSFER_DEST_ID: '17692951'
  MAX_RUNTIME: '21000'
  PRE_CLAIM_TRANSFER_THRESHOLD: '50000'

jobs:
  run-bot-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install playwright psutil websocket-client requests && playwright install chromium
      - run: timeout 3500 python -u ck1.py 2>&1 || true

